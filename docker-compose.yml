services:
  db:
    image: postgres:16-alpine
    container_name: skillbridge-db
    environment:
      POSTGRES_USER: skillbridge
      POSTGRES_PASSWORD: skillbridge
      POSTGRES_DB: skillbridge
    ports:
      - "5432:5432"
    volumes:
      - skillbridge_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skillbridge -d skillbridge"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  skillbridge_pg:
